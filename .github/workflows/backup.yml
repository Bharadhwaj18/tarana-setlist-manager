name: Backup Supabase Database

# This repo is public, so backups never touch it — they're dumped and
# pushed straight to a separate PRIVATE repo (Bharadhwaj18/db-dump). Only
# the public schema is dumped, never auth/storage/other Supabase-internal
# schemas, to keep the backup's blast radius to just this app's own data.

on:
  schedule:
    - cron: '0 20 * * *' # 20:00 UTC daily (~1:30 AM IST)
  workflow_dispatch: {} # lets you trigger a backup manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        # ubuntu-latest's default postgresql-client is older than Supabase's
        # Postgres version, and pg_dump refuses to dump from a server newer
        # than itself — pull the client straight from the official PGDG repo
        # instead, which always has the current release available. Installs
        # the latest major version PGDG offers rather than pinning one, so
        # this keeps working across future Supabase Postgres upgrades.
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          latest=$(apt-cache search '^postgresql-client-[0-9]+$' | grep -oE '[0-9]+' | sort -n | tail -1)
          sudo apt-get install -y "postgresql-client-$latest"

      - name: Dump the public schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # Call the newest installed pg_dump explicitly — plain `pg_dump` on
        # PATH still resolves to the runner's older preinstalled client,
        # which refuses to dump a server newer than itself.
        run: |
          pg_dump_bin=$(ls -d /usr/lib/postgresql/*/bin/pg_dump | sort -V | tail -1)
          "$pg_dump_bin" --schema=public --no-owner --no-privileges -F p -f backup.sql "$SUPABASE_DB_URL"

      - name: Push to the private backups repo
        env:
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Bharadhwaj18/db-dump.git backups-repo
          cp backup.sql backups-repo/latest.sql
          cd backups-repo
          git config user.name "tarana-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.sql
          git commit -m "Backup $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes since last backup"
          git push
